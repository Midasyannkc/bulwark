# Invented partner integration profiles.
partners:
  - id: lab-vendor
    purpose: treatment
    baa: true
    tls_min: "1.2"
    auth: {type: oauth2_client_credentials, token_ttl_minutes: 10, mtls: true}
    scopes: [system/Observation.read, system/Patient.read]
    needs: [Observation, Patient]
    fields_requested: {Patient: [id, birthDate, gender], Observation: [status, code, subject, "value[x]"]}
    webhook: {signed: true, ip_allowlist: true}
    breach_notice_hours: 48
  - id: ehr-partner
    purpose: treatment
    baa: true
    tls_min: "1.0"
    auth: {type: oauth2_client_credentials, token_ttl_minutes: 600, mtls: false}
    scopes: [system/*.*]
    needs: [Patient, Encounter]
    fields_requested: {Patient: [id, name, birthDate, ssn, address], Encounter: [status, class, subject]}
    webhook: {signed: false, ip_allowlist: false}
    breach_notice_hours: 240
  - id: marketing-analytics
    purpose: marketing
    baa: false
    tls_min: "1.2"
    auth: {type: api_key, token_ttl_minutes: 0, mtls: false}
    scopes: [system/Patient.read]
    needs: [Patient]
    fields_requested: {Patient: [id, name, telecom, address]}
    webhook: {signed: false, ip_allowlist: false}
    breach_notice_hours: 0
